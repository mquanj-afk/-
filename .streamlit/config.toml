[client]
# ツールバーの「Deploy」ボタンやGitHubアイコンなど、開発者向けメニューを非表示にする
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#D9455F"            # もみじの濃いピンク赤(ボタン・アクセント)
backgroundColor = "#FFF8F6"         # 目に優しい淡いピンクベージュ
secondaryBackgroundColor = "#FDE7E9" # サイドバー・カードの薄いピンク
textColor = "#3B2A2A"               # 黒より柔らかい、目に優しい濃茶系テキスト
# 丸みのあるフレンドリーな日本語対応フォント。Streamlit公式のGoogle Fonts指定方式。
font = "'M PLUS Rounded 1c':https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap, sans-serif"
headingFont = "'M PLUS Rounded 1c':https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap, sans-serif"

